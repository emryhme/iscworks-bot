<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISCWORKS — Master SaaS Super-Admin Giriş Portalı</title>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: radial-gradient(circle at top right, #1e1b4b 0%, #090d16 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }

    .master-login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.15);
      color: white;
    }

    .master-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .master-logo {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 26px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }

    .master-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .master-header p {
      font-size: 12px;
      color: #a78bfa;
    }

    .badge-super-admin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #ddd6fe;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8b5cf6;
      font-size: 15px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }

    .btn-master-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
      transition: all 0.2s;
    }

    .btn-master-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5);
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="master-login-card">
  <div class="master-header">
    <div class="master-logo">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1>ISCWORKS SaaS</h1>
    <p>Master Super-Admin Platform Portalı</p>
    <div class="badge-super-admin">
      <i class="fa-solid fa-lock" style="font-size:9px;"></i> SUPER ADMIN ACCESS ONLY
    </div>
  </div>

  <div class="alert-danger" id="masterAlert">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="masterAlertText">Yetkisiz erişim denemesi!</span>
  </div>

  <form id="masterLoginForm">
    <div class="form-group">
      <label>Master Super-Admin Kullanıcı Adı</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-user-shield"></i>
        <input type="text" id="masterUsername" placeholder="Örn: tonystark" value="tonystark" required>
      </div>
    </div>

    <div class="form-group">
      <label>Master Güvenlik Şifresi</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="masterPassword" placeholder="••••••••" value="cintonik!" required>
      </div>
    </div>

    <button type="submit" class="btn-master-login" id="btnMasterSubmit">
      <i class="fa-solid fa-shield-cat"></i>
      Master Konsola Giriş Yap
    </button>
  </form>

  <div style="text-align:center; margin-top:24px;">
    <a href="login.html" style="color:#94a3b8; font-size:11px; text-decoration:none;">
      ← Normal Mağaza Paneli Girişine Dön
    </a>
  </div>
</div>

<script>
  document.getElementById('masterLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('masterAlert');
    const alertText = document.getElementById('masterAlertText');
    const submitBtn = document.getElementById('btnMasterSubmit');

    const username = document.getElementById('masterUsername').value.trim();
    const password = document.getElementById('masterPassword').value.trim();

    const validMasterUsers = ['tonystark', 'master', 'boss@iscworks.com', 'admin'];
    const validMasterPasses = ['cintonik!', 'master2026!', 'barons2026!'];

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Master Yetki Doğrulanıyor...';

    if (validMasterUsers.includes(username) && validMasterPasses.includes(password)) {
      const token = 'master_token_' + Date.now();
      localStorage.setItem('iscworks_master_token', token);
      localStorage.setItem('iscworks_is_master_admin', 'true');
      localStorage.setItem('barons_admin_token', token);

      setTimeout(() => {
        window.location.href = 'master.html';
      }, 500);
    } else {
      alertText.textContent = '❌ Yetkisiz Giriş: Master Super-Admin şifresi hatalı!';
      alertBox.style.display = 'flex';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-shield-cat"></i> Master Konsola Giriş Yap';
    }
  });
</script>

</body>
</html>
